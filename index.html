<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>거지키우기</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Jua&family=Black+Han+Sans&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5f4f1; --panel:#ffffff; --ink:#18181b; --sub:#8b8b92; --line:#ececea;
    --accent:#18181b; --accent2:#b8892f; --gold:#c9a24a; --soft:#f6f5f2;
    --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.04);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;
    min-height:100vh;display:flex;justify-content:center;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
  .wrap{width:100%;max-width:980px;padding:20px;display:grid;grid-template-columns:1fr 360px;gap:14px}
  @media (max-width:820px){.wrap{grid-template-columns:minmax(0,1fr)}}
  .wrap>*{min-width:0}
  .tabs button{min-width:0;flex:1 1 0;overflow:hidden;text-overflow:clip;padding-left:2px;padding-right:2px}
  .foot .lbl{display:none}
  .tabs button .ti{font-style:normal}
  @media (max-width:820px){
    .tabs button{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10.5px;line-height:1.15;padding-top:5px;padding-bottom:5px}
    .tabs button .ti{font-size:15px}
  }
  .foot button{font-size:15px;padding:7px 2px}
  @media (min-width:600px) and (max-width:820px){.wrap{grid-template-columns:minmax(0,1fr) 320px}
    .tabs button{font-size:11.5px;letter-spacing:-.04em}}
  @media (max-width:340px){
    .wrap{padding:6px;gap:6px}
    .card{padding:10px;border-radius:12px}
    .tabs button{font-size:10px;padding:6px 0;letter-spacing:-.05em}
    .scene{height:190px}
    .item{grid-template-columns:30px 1fr auto;gap:7px;padding:6px}
    .item .ic{width:30px;height:30px;line-height:30px;font-size:17px}
    .foot{gap:4px} .foot button{padding:6px 2px;font-size:11px}
    #stChip{font-size:10px}
    .tg .bt button{font-size:11px}
  }
  h1,h2,.jua{font-weight:700}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
  header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px}
  header h1{margin:0;font-size:18px;font-weight:700;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
  header h1 .dot{width:8px;height:8px;border-radius:50%;background:var(--gold);display:inline-block}
  header h1 small{font-size:11px;font-weight:500;color:var(--sub);letter-spacing:.08em}
  .money{font-size:28px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums;letter-spacing:-.03em;white-space:nowrap;line-height:1.25;height:1.25em;overflow:hidden}
  .money .mg{display:inline-block}
  html,body{overflow-x:hidden}
  header>div:last-child{min-width:0;flex:1}
  header h1{white-space:nowrap;flex:none}
  .money{max-width:100%}
  .rates,#target{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  @media (max-width:700px){
    header{flex-direction:column;align-items:stretch;gap:2px}
    header h1{font-size:15px}
    header>div:last-child{text-align:center}
    .money{text-align:center}
    .rates{text-align:center}
  }
  .money .mg u{text-decoration:none;font-weight:700;margin:0 .12em 0 .02em}
  .money .mg.fx .mn{display:inline-block;min-width:4.5ch;text-align:right}
  .money .mg:last-child u{margin-right:0}
  .rates{color:var(--sub);font-size:12px;text-align:right;margin-top:2px}
  /* stage */
  .stage{position:relative;text-align:center;overflow:hidden;min-height:440px;display:flex;flex-direction:column;align-items:center}
  .title-badge{align-self:flex-start;font-size:12px;font-weight:500;color:var(--accent2);background:#faf5ea;
    border:1px solid #efe3c8;padding:4px 10px;border-radius:999px}
  .scene{position:relative;width:100%;height:280px;margin-top:12px;border-radius:12px;
    background:linear-gradient(180deg,#eef0f3 0%,#f4f4f2 64%,#e9e6df 64%,#e4e0d7 100%);overflow:hidden}
  .beggar{position:absolute;left:50%;bottom:9%;transform:translateX(-50%);font-size:104px;cursor:pointer;
    user-select:none;transition:transform .08s;filter:drop-shadow(0 8px 10px rgba(0,0,0,.08))}
  .bowl{position:absolute;left:calc(50% + 66px);bottom:10%;font-size:34px}
  .float-old{
    animation:up .9s ease-out forwards;font-variant-numeric:tabular-nums}
  @keyframes up{to{transform:translateY(-60px);opacity:0}}
  .golden{position:absolute;font-size:38px;cursor:pointer;animation:bob 1.4s ease-in-out infinite;z-index:5;
    filter:drop-shadow(0 4px 8px rgba(201,162,74,.45))}
  @keyframes bob{50%{translate:0 -8px}}
  @keyframes spin{50%{rotate:12deg}}
  .hint{color:var(--sub);font-size:12px;margin-top:12px}
  .hint b{color:var(--ink);font-weight:500;border:1px solid var(--line);border-radius:5px;padding:0 5px;background:var(--soft)}
  .progress{width:100%;margin-top:14px;text-align:left}
  .bar{height:4px;background:#efeeea;border-radius:999px;overflow:hidden}
  .bar>i{display:block;height:100%;background:var(--gold);width:0;transition:width .3s}
  .progress small{color:var(--sub);font-size:11px;display:block;margin-top:6px}
  .log{width:100%;margin-top:14px;text-align:left;font-size:12px;color:#55555c;max-height:90px;overflow:auto;
    border-top:1px solid var(--line);padding-top:10px}
  .log div{padding:2px 0}
  /* shop */
  .tabs{display:flex;gap:2px;margin-bottom:12px;background:var(--soft);padding:3px;border-radius:10px}
  .tabs button{white-space:nowrap;flex:1;font-family:inherit;font-size:13px;font-weight:500;border:none;background:transparent;color:var(--sub);
    border-radius:8px;padding:7px;cursor:pointer;transition:.15s}
  .tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .list{display:flex;flex-direction:column;gap:2px;max-height:560px;overflow:auto}
  .item{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;border-radius:10px;
    padding:8px;cursor:pointer;transition:background .12s}
  .item:hover{background:var(--soft)}
  .item.no{opacity:.4;cursor:not-allowed}
  .item.no:hover{background:transparent}
  .item.locked{opacity:.3;cursor:not-allowed}
  .item.locked:hover{background:transparent}
  .item .ic{font-size:22px;text-align:center;width:36px;height:36px;line-height:36px;background:var(--soft);border-radius:9px}
  .item .nm{font-size:14px;font-weight:500}
  .item .ds{font-size:11px;color:var(--sub);margin-top:1px}
  .item .ef{font-size:11px;color:var(--accent2);font-weight:500;margin-top:1px;font-variant-numeric:tabular-nums}
  .item .pr{font-size:13px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
  .item .cnt{font-size:11px;color:var(--sub);text-align:right;white-space:nowrap}
  .item{position:relative;overflow:hidden}
  .item .mid{min-width:0}
  .item .nm{display:flex;align-items:center;gap:5px}
  .item .mx{font-size:9.5px;font-weight:800;color:#5a3500;background:linear-gradient(180deg,#ffd76a,#f0a92e);border-radius:5px;padding:0 4px;line-height:15px}
  .item .rt{text-align:right}
  .item .cnt{font-weight:700;color:#55555c!important;font-variant-numeric:tabular-nums}
  .item .cnt span{font-weight:500;color:#b9b4aa}
  .msl{position:absolute;left:54px;right:10px;bottom:3px;height:2px;border-radius:2px;background:#efe9de}
  .msl i{display:block;height:100%;border-radius:2px;background:linear-gradient(90deg,#ffd76a,#f0a92e)}
  body.mini .msl{left:36px;right:6px;bottom:1px}
  .ms{display:flex;align-items:center;gap:6px;margin-top:4px}
  .msb{flex:1;max-width:90px;height:5px;border-radius:999px;background:#ece5d8;overflow:hidden}
  .msb i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#ffd76a,#f0a92e)}
  .ms span{font-size:10px;color:var(--sub);white-space:nowrap}
  .ms em{font-style:normal;color:var(--accent2);font-weight:700}
  body.mini .ms{margin-top:2px;gap:4px}
  body.mini .msb{max-width:50px;height:4px}
  body.mini .ms span{font-size:9px}
  .foot{display:flex;gap:6px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
  .foot button{flex:1;font-family:inherit;font-size:12px;border:1px solid var(--line);border-radius:8px;padding:7px;cursor:pointer;background:#fff;color:#55555c;transition:.12s}
  .foot button:hover{background:var(--soft);color:var(--ink)}
  .credit{margin-top:10px;text-align:center;font-size:10px;color:#b5b5ba;letter-spacing:.14em}
  .modal{position:fixed;inset:0;background:rgba(40,30,22,.55);display:none;align-items:center;justify-content:center;z-index:50}
  .modal.show{display:flex}
  .modal .box{background:#fff;border-radius:16px;padding:24px;max-width:320px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.15);font-size:14px;color:#3f3f46}
  .modal .box h2{margin:0 0 8px;font-size:17px;color:var(--ink)}
  .modal .box button{font-family:inherit;font-size:13px;font-weight:500;border:none;border-radius:8px;padding:8px 18px;margin:12px 3px 0;cursor:pointer;background:var(--ink);color:#fff}
  .modal .box button.gray{background:var(--soft);color:var(--ink)}
  .modal .box .jua{color:var(--accent2)!important}

  /* competitive */
  #rankChip{margin-top:6px;display:inline-block;font-size:11px;font-weight:500;color:var(--accent2);background:#faf5ea;border:1px solid #efe3c8;border-radius:999px;padding:2px 9px;cursor:pointer}
  header>div:last-child{text-align:right}
  body.mini header>div:last-child{text-align:center}
  #combo{position:absolute;top:8px;right:10px;font-size:12px;font-weight:700;color:var(--accent2);background:rgba(255,255,255,.85);
    border-radius:999px;padding:3px 9px;opacity:0;transition:opacity .2s;font-variant-numeric:tabular-nums}
  #combo.show{opacity:1}
  #combo.ch{color:#fff;background:#d9480f}
  #toast{position:fixed;left:50%;top:12px;transform:translate(-50%,-30px);opacity:0;transition:.25s;z-index:80;
    background:var(--ink);color:#fff;font-size:13px;padding:8px 14px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.18);max-width:90vw;text-align:center}
  #toast.show{transform:translate(-50%,0);opacity:1}
  .sec{font-size:11px;font-weight:700;color:var(--sub);letter-spacing:.06em;margin:8px 4px 4px}
  .rk{display:grid;grid-template-columns:22px 26px 1fr auto;gap:6px;align-items:center;padding:6px 6px;border-radius:9px;font-size:13px}
  .rk .n{color:var(--sub);font-weight:700;font-size:12px;text-align:center}
  .rk .m{font-weight:700;font-size:12px;font-variant-numeric:tabular-nums}
  .rk.me{background:#faf5ea;outline:1px solid #efe3c8}
  .rk.me .n{color:var(--accent2)}
  .chbtn{width:100%;font-family:inherit;font-size:13px;font-weight:500;border:none;border-radius:10px;padding:10px;cursor:pointer;background:var(--ink);color:#fff;margin:2px 0 4px}
  .chbtn:disabled{opacity:.5;cursor:default}
  .ach{display:grid;grid-template-columns:26px 1fr;gap:6px;align-items:center;padding:5px 6px;font-size:12px}
  .ach .ai{font-size:16px;text-align:center}
  .ach small{color:var(--sub);display:block;font-size:10px}
  .ach.off{opacity:.35;filter:grayscale(1)}
  body.mini .rk{font-size:11px;padding:4px;grid-template-columns:18px 20px 1fr auto}
  body.mini .rk .m{font-size:10px}
  body.mini .chbtn{font-size:11px;padding:7px}
  body.mini .ach{font-size:11px}
  body.mini #rankChip{font-size:10px;margin-top:3px}

  /* ===== motion ===== */
  :root{--ease:cubic-bezier(.16,1,.3,1)}
  .beggar{left:0!important;right:0;margin:0 auto;width:max-content;transform:none!important;transition:transform .18s var(--ease);transform-origin:bottom center}
  .beggar.hit{transform:scale(1.035,.965)!important;transition-duration:.05s}
  #face{display:inline-block;animation:breathe 3.6s ease-in-out infinite;transform-origin:bottom center}
  @keyframes breathe{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-2px) scale(.99,1.015)}}
  .bowl{transition:transform .3s var(--ease)}
  .bowl.tilt{transform:rotate(-5deg) translateY(-1px);transition-duration:.06s}
  .float{position:absolute;font-weight:700;font-size:13px;color:#8a6a22;pointer-events:none;white-space:nowrap;z-index:6;
    font-variant-numeric:tabular-nums;animation:fl .9s var(--ease) forwards;text-shadow:0 1px 0 rgba(255,255,255,.8)}
  @keyframes fl{0%{transform:translateY(4px) scale(.92);opacity:0}15%{opacity:1}100%{transform:translateY(-34px) scale(1);opacity:0}}
  .cloud{position:absolute;font-size:28px;opacity:.35;filter:grayscale(.3) blur(.3px);animation:drift linear infinite;pointer-events:none}
  @keyframes drift{from{left:-15%}to{left:110%}}
  .walker{position:absolute;bottom:8%;font-size:34px;pointer-events:none;z-index:1;opacity:.85;filter:saturate(.85)}
  .walker.l{animation:walkL 11s linear forwards;left:0!important}
  .walker.r{animation:walkR 11s linear forwards;left:0!important}
  .walker span span{display:inline-block;animation:step .55s ease-in-out infinite}
  @keyframes walkL{from{transform:translateX(calc(var(--sw,300px)*-.12))}to{transform:translateX(calc(var(--sw,300px)*1.08))}}
  @keyframes walkR{from{transform:translateX(calc(var(--sw,300px)*1.08))}to{transform:translateX(calc(var(--sw,300px)*-.12))}}
  @keyframes step{50%{transform:translateY(-1.5px)}}
  .bar>i{position:relative;overflow:hidden;transition:width .6s var(--ease)}
  .bar>i::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);
    transform:translateX(-100%);animation:sheen 3s ease-in-out infinite}
  @keyframes sheen{60%,100%{transform:translateX(100%)}}
  .item{transition:background .2s,transform .2s var(--ease)}
  .item.pop{animation:pop .5s var(--ease)}
  @keyframes pop{0%{background:#faf3e1}100%{background:transparent}}
  #combo{transition:opacity .25s,transform .25s var(--ease)}
  #combo.tick{transform:scale(1.06)}
  .title-badge{transition:box-shadow .6s}
  .title-badge.glow{animation:glow 1.8s var(--ease)}
  @keyframes glow{0%{box-shadow:0 0 0 0 rgba(201,162,74,.55)}100%{box-shadow:0 0 0 12px rgba(201,162,74,0)}}
  .golden{animation:hover 2.4s ease-in-out infinite;filter:drop-shadow(0 6px 14px rgba(201,162,74,.5));transition:transform .2s var(--ease)}
  .golden:hover{transform:scale(1.12)}
  .golden.in{animation:gin .6s var(--ease), hover 2.4s .6s ease-in-out infinite}
  @keyframes gin{from{opacity:0;transform:translateY(-20px) scale(.7)}}
  @keyframes hover{50%{translate:0 -6px}}
  #fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:95}
  #toast{transition:transform .45s var(--ease),opacity .3s}

  /* level up overlay */
  #lvup{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;flex-direction:column;cursor:pointer;
    background:rgba(14,12,10,.78);color:#fff;text-align:center;
    opacity:0;visibility:hidden;transition:opacity .5s var(--ease),visibility .5s}
  #lvup.show{opacity:1;visibility:visible}
  #lvup .in{display:flex;flex-direction:column;align-items:center}
  #lvup .k{font-size:10px;letter-spacing:.5em;color:#cdb27a;font-weight:500;margin-bottom:18px;opacity:0;transform:translateY(6px);transition:all .8s var(--ease) .15s}
  #lvup .halo{position:relative;width:min(42vmin,180px);height:min(42vmin,180px);display:flex;align-items:center;justify-content:center}
  #lvup .halo > svg{position:absolute;inset:0;transform:rotate(-90deg)}
  #lvup .halo circle{fill:none;stroke-width:1.2}
  #lvup .halo .bg{stroke:rgba(255,255,255,.08)}
  #lvup .halo .fg{stroke:url(#lg);stroke-linecap:round;stroke-dasharray:302;stroke-dashoffset:302;transition:stroke-dashoffset 1.4s var(--ease) .25s}
  #lvup .halo::before{content:'';position:absolute;inset:18%;border-radius:50%;background:radial-gradient(circle,rgba(232,201,122,.28),transparent 70%);
    opacity:0;transform:scale(.6);transition:all 1.2s var(--ease) .3s}
  #lvup .f{position:relative;font-size:min(20vmin,84px);opacity:0;transform:scale(.6) translateY(10px);filter:blur(6px);transition:all 1s var(--ease) .35s}
  #lvup .lv{font-size:11px;color:#8f8676;margin-top:18px;letter-spacing:.2em;opacity:0;transition:all .8s var(--ease) .6s;font-variant-numeric:tabular-nums}
  #lvup .n{font-size:min(8vmin,34px);font-weight:700;letter-spacing:-.03em;margin-top:6px;
    background:linear-gradient(180deg,#fff 30%,#e3c47e);-webkit-background-clip:text;background-clip:text;color:transparent}
  #lvup .n span{display:inline-block;opacity:0;transform:translateY(14px);filter:blur(4px);transition:all .7s var(--ease)}
  #lvup .line{width:0;height:1px;background:linear-gradient(90deg,transparent,#cdb27a,transparent);margin:16px 0 12px;transition:width 1s var(--ease) 1s}
  #lvup .b{font-size:12px;color:#d9c79f;opacity:0;transition:opacity .8s 1.2s}
  #lvup .b b{color:#f1d68f;font-weight:700}
  #lvup .skip{position:absolute;bottom:14px;font-size:10px;color:#5d574e;letter-spacing:.1em}
  #lvup.go .k,#lvup.go .lv{opacity:1;transform:none}
  #lvup.go .fg{stroke-dashoffset:0}
  #lvup.go .halo::before{opacity:1;transform:scale(1)}
  #lvup.go .f{opacity:1;transform:none;filter:none}
  #lvup.go .n span{opacity:1;transform:none;filter:none}
  #lvup.go .line{width:min(50vw,180px)}
  #lvup.go .b{opacity:1}
  body.mini #lvup .k{margin-bottom:10px}

  /* ===== living scene ===== */
  .scene{background:var(--sky,linear-gradient(180deg,#dfe9f1,#f4f4f2));transition:background 2s}
  .scene::after{content:'';position:absolute;left:0;right:0;bottom:0;height:36%;background:var(--ground,linear-gradient(#e9e6df,#e2ddd3));transition:background 2s;z-index:0}
  #city{position:absolute;left:0;bottom:36%;width:100%;height:62%;z-index:0;pointer-events:none}
  #city .w{transition:fill 2s}
  #sky{position:absolute;inset:0;pointer-events:none;z-index:0}
  #orb{position:absolute;width:26px;height:26px;border-radius:50%;right:14%;top:12%;transition:all 2s}
  .star{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:0;animation:tw 3s ease-in-out infinite}
  .scene.night .star{opacity:.8}
  @keyframes tw{50%{opacity:.25}}
  .scene.night .cloud{opacity:.12}
  .scene.night .float{color:#f1d68f;text-shadow:0 1px 6px rgba(0,0,0,.5)}
  .beggar,.bowl,.walker,.golden,#combo,.cloud{z-index:2}
  .scene .lamp{position:absolute;bottom:36%;width:2px;height:30%;background:#6b6f7a;z-index:1;opacity:.5}
  .scene .lamp::before{content:'';position:absolute;top:-4px;left:-5px;width:12px;height:5px;border-radius:3px;background:#6b6f7a}
  .scene .lamp::after{content:'';position:absolute;top:0;left:-50px;width:102px;height:180%;opacity:0;transition:opacity 2s;
    background:radial-gradient(ellipse at 50% 0,rgba(255,214,140,.38),transparent 65%)}
  .scene.night .lamp::after{opacity:1}
  body.mini .scene .lamp{display:none}
  body.mini #orb{width:14px;height:14px}

  /* fever */
  .scene.fever{box-shadow:inset 0 0 0 2px rgba(232,190,100,.9),inset 0 0 40px rgba(232,190,100,.55)}
  #fever{position:absolute;left:10px;top:8px;z-index:3;font-size:11px;font-weight:700;letter-spacing:.12em;color:#1a1408;
    background:linear-gradient(90deg,#f6e3a1,#d4a63c);border-radius:999px;padding:3px 10px 3px 10px;display:none;overflow:hidden}
  #fever.on{display:block;animation:fv 1s ease-in-out infinite}
  #fever i{position:absolute;left:0;bottom:0;height:2px;background:#1a1408;opacity:.5}
  @keyframes fv{50%{box-shadow:0 0 14px rgba(232,190,100,.9)}}
  body.mini #fever{font-size:9px;padding:2px 7px;left:6px;top:5px}

  /* ===== app-game scene ===== */
  .scene{background:#5bbcf5!important;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06),inset 0 -30px 50px -30px rgba(0,0,0,.18)}
  .scene::after{display:none}
  #city{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
  #city .cl{animation:cloudmove linear infinite}
  @keyframes cloudmove{from{transform:translateX(-140px)}to{transform:translateX(560px)}}
  #city .st{animation:tw 3s ease-in-out infinite}
  .mat{position:absolute;left:50%;bottom:6%;width:150px;height:26px;margin-left:-75px;border-radius:6px;z-index:1;

function autoList(){
  const key=(S.route||'')+'|'+(S.sub||'');
  if(key===_autoKey && _autoList) return _autoList;
  const L=COMMON.map(x=>Object.assign({grp:'common'},x));
  if(S.route && ROUTE_ITEMS[S.route]) ROUTE_ITEMS[S.route].forEach(([ic,nm,ds],i)=>L.push({id:`r_${S.route}_${i}`,ic,nm,ds,base:TIERS_R[i][0],cps:TIERS_R[i][1],grp:'route'}));
  const sk2=S.route&&S.sub?S.route+'.'+S.sub:null;
  if(sk2 && SUB_ITEMS[sk2]) SUB_ITEMS[sk2].forEach(([ic,nm,ds],i)=>L.push({id:`s_${sk2}_${i}`,ic,nm,ds,base:TIERS_S[i][0],cps:TIERS_S[i][1],grp:'sub'}));
  _autoKey=key; _autoList=L; return L;
}
function migrateItems(){
  if(!S.route) return;
  GEN_OLD.forEach((g,i)=>{ const n=S.auto[g]; if(n){ const id=`r_${S.route}_${i}`; S.auto[id]=(S.auto[id]||0)+n; delete S.auto[g]; } });
}

function fmt(n){
  if(n>0 && n<10 && n%1) return n.toFixed(1)+'원';
  n = Math.floor(n);
  if(n < 1e4) return n.toLocaleString('ko-KR')+'원';
  for(let k=0;k<UNITS.length-1;k++){ const [v,u]=UNITS[k];
    if(n>=v){ const a=Math.floor(n/v+1e-9), nx=UNITS[k+1], rest=Math.max(0,Math.floor((n-a*v)/nx[0]+1e-6));
      return a.toLocaleString('ko-KR')+u+(rest>0&&a<1000?' '+rest.toLocaleString('ko-KR')+nx[1]:'')+'원'; } }
}
function fmtFull(n){
  n=Math.floor(Math.max(0,n));
  if(n<1e4) return n.toLocaleString('ko-KR')+'원';
  const top=UNITS.findIndex(([v])=>n>=v), big=n>=1e16, L=big?UNITS.slice(top,top+3):UNITS.slice(top);

  return parts.join(' ')+'원';
}

function jsk(k){

function lvSeg(){ const i=totalStage(), a=Math.max(10,STAGES[i].need), b=STAGES[i+1]?STAGES[i+1].need:a*20; return {i,a,b}; }
function lvQ(){ const {i,a,b}=lvSeg(); return {i,q:Math.max(0,Math.log(Math.max(1,S.total)/a)/Math.log(b/a))*5}; }
function charLv(){ const {i,q}=lvQ(); return 1+i*5+(i>=LAST?Math.floor(q):Math.min(4,Math.floor(q))); }
function lvFrac(){ const {i,q}=lvQ(); return i>=LAST||q<5 ? q-Math.floor(q) : 1; }
function bossLv(){ return stageIdx()>=LAST&&totalStage()>=LAST&&S.finalOK ? Math.max(0,charLv()-(1+LAST*5)) : 0; }
function spTotal(){ return (charLv()-1)+3*stageIdx()+(S.spBonus||0)+achSP()+itemSP()+5*(S.rebirth||0); }
function itemSP(){ let k=0; for(const a of autoList()){ const n=S.auto[a.id]||0; if(n>=50)k++; if(n>=100)k++; if(n>=200)k++; } return k; }
function achSP(){ return Object.values(S.ach||{}).filter(Boolean).length; }
function spCost(n){ return n.max===1?3:1; }
function spUsed(){ let u=0; for(const n of SKILLS){ if(n.br>0){ const l=sk(n.id); if(l) u+=l*spCost(n); } } return u; }
function spAvail(){ return spTotal()-spUsed(); }
function nextLvNeed(){ const {i,a,b}=lvSeg(), k=charLv()-1-i*5; const t=k>=4&&i<LAST?b:a*Math.pow(b/a,(k+1)/5); return Math.max(0,t-S.total); }
function tabSpUsed(T){ return tabSkills(T).reduce((u,n)=>u+sk(n.id)*spCost(n),0); }

function traitTreeHtml(){

  const R=S.route&&ROUTES[S.route], SB=R&&S.sub&&R.subs[S.sub];
  const nodes=[], lines=[];
  const st=(T,k)=>{ const c=tr(T.t), lock=T.nojob||si<T.lv; return c===k?'on':c?'dim':lock?'lk':'can'; };
  const center=(key,ic,label,on)=>{ nodes.push(`<div class="tnode big ${on?'on':'lk'}" style="left:50%;top:${Y[key]}%">${emo(ic)}</div><div class="tlab" style="left:50%;top:${Y[key]}%">${label}</div>`); };

      const from = T.t===2 ? (tr(1)? (tr(1)==='a'?XA:XB) : 50) : 50, fy = T.t===2 ? Y[1] : Y[prevY[T.t]];
      const gold = c==='on' && (T.t!==2 || tr(1));

const ROB_CAP=0.10;   // 뜯기 한도: 공격자 누적 수입의 10%

const ALLOW_DOWN=false;   // 아래 순위 공격: 서버 업데이트 후 true로

/* ---------- sound (WebAudio, off by default) ---------- */
let AC=null, soundOn=false;
try{ soundOn = localStorage.getItem('geoji_sound')==='1'; }catch(e){}
function sndIcon(){ $('sndBtn').firstChild.textContent = soundOn?'🔊':'🔇'; }
$('sndBtn').onclick=()=>{ soundOn=!soundOn; try{localStorage.setItem('geoji_sound',soundOn?'1':'0');}catch(e){} sndIcon(); if(soundOn) sfx('gold'); };
function tone(f,t0,dur,vol,type){
  const o=AC.createOscillator(), g=AC.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(f,t0);
  g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(vol,t0+.005); g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  o.connect(g).connect(AC.destination); o.start(t0); o.stop(t0+dur+.02);
}
function sfx(kind){
  if(!soundOn) return;
  try{ AC = AC || new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); }catch(e){ return; }
  const t=AC.currentTime;
  if(kind==='click'){ const f=1200+Math.min(combo,60)*14; tone(f,t,.09,.035,'triangle'); tone(f*1.5,t+.012,.07,.015,'sine'); }
  else if(kind==='gold'){ [1318,1568,2093].forEach((f,i)=>tone(f,t+i*.06,.25,.04,'triangle')); }
  else if(kind==='level'){ [523,659,784,1047,1319].forEach((f,i)=>tone(f,t+.1+i*.09,.9,.045,'sine')); tone(262,t+.1,1.4,.03,'triangle'); }
  else if(kind==='fever'){ [784,988,1175,1568].forEach((f,i)=>tone(f,t+i*.05,.35,.04,'square')); }
}

    day:  {s1:'#a9dcf0',s2:'#e8f7fb',far:'#cfe5ee',S:60,L:82,win:'#7d6a5a',lit:'#7d6a5a',side:'#f3e2c4',seam:'#e3cda6',curb:'#d9bf95',tc:'#8fd17a',tc2:'#74bd62',sun:'#ffe08a',cl:'#ffffff',clo:1,stars:0,lamp:0,pole:'#7d6a5a',aw:70},
    dawn: {s1:'#f7b8a0',s2:'#ffe8cf',far:'#efc6b8',S:58,L:80,win:'#fff1e0',lit:'#ffd67a',side:'#f1dcc6',seam:'#e0c6aa',curb:'#c9ad8c',tc:'#79b862',tc2:'#5f9c4f',sun:'#ffc98a',cl:'#fff1ea',clo:.9,stars:0,lamp:.6,pole:'#6b6070',aw:58},
    dusk: {s1:'#5b5bb5',s2:'#ff9e7a',far:'#9a6f93',S:46,L:56,win:'#c9a7a0',lit:'#ffd36e',side:'#dcc1a8',seam:'#c7a98c',curb:'#a98c70',tc:'#4f8a4c',tc2:'#3e733e',sun:'#ff8f5e',cl:'#ffd7c4',clo:.75,stars:.3,lamp:1,pole:'#4c4558',aw:50},
    night:{s1:'#0d1430',s2:'#2c3c70',far:'#1d2650',S:32,L:27,win:'#28304f',lit:'#ffd36e',side:'#3a3b4a',seam:'#30313f',curb:'#2a2b37',tc:'#24503a',tc2:'#1c4030',sun:'#f2eedd',cl:'#8590b5',clo:.22,stars:1,lamp:1,pole:'#4a4f63',aw:30}
  }[k];
  const C=$('city'); if(!C.firstChild) return;
  C.querySelector('#sk1').setAttribute('stop-color',T.s1); C.querySelector('#sk2').setAttribute('stop-color',T.s2);
  C.querySelector('#far').setAttribute('fill',T.far);
  C.querySelector('#stars').setAttribute('opacity',T.stars);
  C.querySelector('#sun').setAttribute('fill',T.sun);
  const sunY = k==='day'?42 : k==='night'?36 : 96;
  C.querySelector('#sun').setAttribute('cy',sunY); C.querySelector('#sunHalo').setAttribute('cy',sunY);
  C.querySelector('#sunHalo').setAttribute('opacity', k==='night'?.4:1);
  C.querySelectorAll('.cloudg').forEach(g=>{g.setAttribute('fill',T.cl); g.setAttribute('opacity',T.clo);});
  C.querySelectorAll('.bd').forEach(g=>{
    const hh=+g.dataset.h;
    g.querySelector('.bw').setAttribute('fill',`hsl(${hh} ${T.S}% ${T.L}%)`);
    g.querySelectorAll('.rf').forEach(e=>e.setAttribute('fill',`hsl(${hh} ${T.S}% ${T.L-18}%)`));
    g.querySelectorAll('.aw').forEach(e=>e.setAttribute('fill',`hsl(${(hh+180)%360} ${T.aw}% ${T.L-8}%)`));
  });
  const lit = k!=='day';
  C.querySelectorAll('.win').forEach(e=>e.setAttribute('fill', (lit && e.dataset.on==='1') ? T.lit : T.win));
  C.querySelector('#side').setAttribute('fill',T.side); C.querySelector('#curb').setAttribute('fill',T.curb);
  C.querySelectorAll('.seam').forEach(e=>e.setAttribute('stroke',T.seam));
  C.querySelectorAll('.tc').forEach(e=>e.setAttribute('fill',T.tc)); C.querySelectorAll('.tc2').forEach(e=>e.setAttribute('fill',T.tc2));
  C.querySelectorAll('.lg').forEach(e=>e.setAttribute('opacity',T.lamp));
  C.querySelectorAll('.rlamp').forEach(e=>e.setAttribute('opacity',k==='day'?0:.35));
  C.querySelectorAll('.lp').forEach(e=>e.setAttribute('stroke',T.pole));
  C.querySelectorAll('.lh').forEach(e=>e.setAttribute('fill', T.lamp?'#ffe29a':T.pole));
  $('scene').classList.toggle('night',k==='night');
}
setInterval(()=>applySky(false),60000);

/* golden coin */
function spawnGold(){
  const sc=$('scene'), g=document.createElement('div');
  g.className='golden in'; g.innerHTML=ICON.gold;
  g.style.left=(10+Math.random()*75)+'%'; g.style.top=(8+Math.random()*40)+'%';
  g.onclick=(e)=>{
    if(Math.random()<.25+perkA('feverP') && Date.now()>=feverEnd){ S.golds++; startFever(15+perkA('feverS')); g.remove(); return; }
    sfx('gold');
    const lucky=Math.random()<perkA('bigBag');
    const bonus=Math.max(100, cps()*30, cpc()*20)*(1+perkA('goldBonus'))*perkM('goldX')*(lucky?10:1);
    earn(bonus); S.golds++;
    if(Math.random()<perkA('bagChain')) setTimeout(spawnGold,500);
    const r=sc.getBoundingClientRect();
    floatText(e.clientX-r.left-30, e.clientY-r.top-20, (g._pet?'🐦 ':'')+(lucky?'🌟 황금 ':'💰 ')+'+'+fmt(bonus));
    log(`💰 돈주머니를 주웠다! +${fmt(bonus)}`);
    g.remove(); render(); refreshAffordable();
  };
  sc.appendChild(g);
  const ab=perkA('autoBag'); if(ab>0 && Math.random()<Math.min(.95,ab)) setTimeout(()=>{ if(!g.isConnected||paused) return; const r=g.getBoundingClientRect(); g._pet=1; g.onclick({clientX:r.left+r.width/2,clientY:r.top+r.height/2}); },1300);
  setTimeout(()=>g.remove(),7000);
}
(function goldLoop(){ setTimeout(()=>{ if(!paused) spawnGold(); goldLoop(); }, (25000+Math.random()*35000)/Math.max(.3,1+perkA('goldFreq'))); })();

$('statsBtn').onclick=()=>{
  const mins=Math.floor((Date.now()-S.start)/60000);

  신분 보너스: <b>+${Math.round((stageBonus()-1)*100)}%</b><br>인생 선택 보너스: <b>×${(S.pathMul||1).toFixed(2)}</b><br>루트: <b>${S.route&&ROUTES[S.route]?ROUTES[S.route].ic+' '+ROUTES[S.route].nm+(S.sub?' · '+ROUTES[S.route].subs[S.sub].nm:''):'미정'}</b> · 엔딩 <b>${(S.routesDone||[]).filter(x=>x.includes('.')).length}/60</b> · 환생 <b>${S.rebirth||0}회</b> (×${rebirthMult().toFixed(1)})<br>플레이 시간: <b>${Math.floor(mins/60)}시간 ${mins%60}분</b></p>
  ${(S.path&&S.path.length)?`<div style="text-align:left;font-size:12px;line-height:1.8;border-top:1px solid #eee;padding-top:8px"><b>🛤️ 인생 루트</b><br>${S.path.map(p=>`${((CTYPE[p.key]||{}).ic||'🎴')} ${p.sn||getStage(p.st).name} · ${p.nm} ${p.win?'✅':'❌'}`).join('<br>')}</div>`:''}
  <button class="gray" onclick="showPatchNotes()">📜 패치노트</button><button class="gray" onclick="askReset()">🔄 처음부터</button><button onclick="hideModal()">닫기</button>`);
};

/* main loop */
let prev=performance.now();
let shownMoney=0;
document.addEventListener('visibilitychange',()=>document.body.classList.toggle('hid',document.hidden));
let uiT=0;
function tick(now){
  const dt=(now-prev)/1000; prev=now;
  if(dt<5 && !paused){ const c=cps(), sh=managedShare(); earn(c*sh*dt); if(sh<1){ S.pend=Math.min(pendCap(), (S.pend||0)+c*(1-sh)*dt); } }
  updPend();
  if(!document.hidden && now-uiT>=90){ const udt=(now-uiT)/1000; uiT=now;
    const diff=S.money-shownMoney; shownMoney = Math.abs(diff)<1 ? S.money : shownMoney+diff*Math.min(1,udt*14);
    render(); refreshAffordable(); }
  requestAnimationFrame(tick);
}
